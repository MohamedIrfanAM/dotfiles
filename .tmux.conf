set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind k split-window -h 

unbind '"'
bind j split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

bind -r M resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

unbind n
unbind p

bind -r h previous-window
bind -r l next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'odedarad/onedark.tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# tmux One Dark statusline — tab-style window list
# Requires a Nerd Font in your terminal for the round glyphs.
# Add to ~/.tmux.conf (or `source` this file from it), then
# reload with:  tmux source-file ~/.tmux.conf
# ============================================================

# ---- One Dark palette ----
# bg        #282c34
# bg-alt    #21252b
# fg        #abb2bf
# gray      #3e4451   (inactive tab pill)
# red       #e06c75
# green     #98c379
# yellow    #e5c07b
# blue      #61afef   (session pill, normal)
# purple    #c678dd
# cyan      #56b6c2
#
# roles used below:
#   green  #98c379 -> active window pill
#   red    #e06c75 -> session pill while prefix key is held

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position top 

# Base bar look
set -g status-style "bg=#282c34,fg=#abb2bf"

# Overall bar length / padding
set -g status-left-length 40
set -g status-right-length 90

# ---- Left: session name pill (turns red while prefix key is held) ----
set -g status-left "#[fg=#282c34,bg=#{?client_prefix,#e06c75,#61afef},bold]  #S #[fg=#{?client_prefix,#e06c75,#61afef},bg=#282c34]#[default]"

# ---- Window list (the "tabs") ----
set -g window-status-separator ""

# Inactive window pill: gray, rounded caps
set -g window-status-format "#[fg=#282c34,bg=#3e4451] #I#[fg=#abb2bf,bg=#3e4451] #{?window_zoomed_flag, ,} #{b:pane_current_path} #[fg=#3e4451,bg=#282c34]#[default] "

# Active window pill: One Dark green, rounded caps
set -g window-status-current-format "#[fg=#282c34,bg=#98c379,bold] #I#[fg=#282c34,bg=#98c379,bold] #{?window_zoomed_flag, ,} #{b:pane_current_path} #[fg=#98c379,bg=#282c34]#[default] "

# ---- Right: gcloud project, k8s context, then username ----
set -g status-right "#[fg=#3e4451,bg=#282c34]#[fg=#61afef,bg=#3e4451]  #(~/.tmux/scripts/gcloud-project.sh) #[fg=#3e4451,bg=#282c34]#[fg=#c678dd,bg=#3e4451] #(~/.tmux/scripts/k8s-context.sh) #[fg=#3e4451,bg=#282c34]#[fg=#98c379,bg=#3e4451] irfan.m #[fg=#3e4451,bg=#282c34]#[default]"

# ---- Misc niceties that pair well with this look ----
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#98c379"

# Maximize/restore the current pane with prefix + m
# (uses the same zoom state the tab icon above already reacts to)
bind-key m resize-pane -Z
set -g message-style "fg=#282c34,bg=#e5c07b,bold"
