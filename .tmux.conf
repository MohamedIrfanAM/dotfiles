set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"
set -g focus-events on          # let nvim see pane focus, so it can auto-reload files changed outside it

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind k split-window -h 

unbind '"'
bind j split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

bind -r M resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

unbind n
unbind p

bind -r h previous-window
bind -r l next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'JosephLai241/tmux-line-numbers' # relative line numbers in copy mode

set -g @line-numbers-relative on

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# tmux Decay statusline — tab-style window list
# Requires a Nerd Font in your terminal for the round glyphs.
# Reload with:  tmux source-file ~/.tmux.conf
# ============================================================

# ---- Decay palette (decaycs, matches ghostty/zed/nvim) ----
# bg        #171b20   (bar uses bg=default so ghostty's opacity shows through)
# fg        #b6beca
# gray      #242931   (inactive tab pill)
# red       #e05f65
# green     #78dba9
# yellow    #f1cf8a
# blue      #70a5eb   (session pill, normal)
# magenta   #c68aee
# cyan      #74bee9
#
# roles used below:
#   green  #78dba9 -> active window pill
#   red    #e05f65 -> session pill while prefix key is held

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position top 

# Base bar look (transparent, inherits the terminal background)
set -g status-style "bg=default,fg=#b6beca"

# Overall bar length / padding
set -g status-left-length 40
set -g status-right-length 90

# ---- Left: session name pill (turns red while prefix key is held) ----
set -g status-left "#[fg=#171b20,bg=#{?client_prefix,#e05f65,#70a5eb},bold]  #S #[fg=#{?client_prefix,#e05f65,#70a5eb},bg=default]#[default]"

# ---- Window list (the "tabs") ----
set -g window-status-separator ""

# Inactive window pill: gray, rounded caps
set -g window-status-format "#[fg=#6a7992,bg=#242931] #I#[fg=#b6beca,bg=#242931] #{?window_zoomed_flag, ,} #{b:pane_current_path} #[fg=#242931,bg=default]#[default] "

# Active window pill: Decay green, rounded caps
set -g window-status-current-format "#[fg=#171b20,bg=#78dba9,bold] #I#[fg=#171b20,bg=#78dba9,bold] #{?window_zoomed_flag, ,} #{b:pane_current_path} #[fg=#78dba9,bg=default]#[default] "

# ---- Right: gcloud project, k8s context, then username ----
set -g status-right "#[fg=#242931,bg=default]#[fg=#70a5eb,bg=#242931]  #(~/.tmux/scripts/gcloud-project.sh) #[fg=#242931,bg=default]#[fg=#c68aee,bg=#242931] #(~/.tmux/scripts/k8s-context.sh) #[fg=#242931,bg=default]#[fg=#78dba9,bg=#242931] irfan.m #[fg=#242931,bg=default]#[default]"

# ---- Misc niceties that pair well with this look ----
set -g pane-border-style "fg=#242931"
set -g pane-active-border-style "fg=#78dba9"

# Maximize/restore the current pane with prefix + m
# (uses the same zoom state the tab icon above already reacts to)
bind-key m resize-pane -Z
set -g message-style "fg=#171b20,bg=#f1cf8a,bold"
set -g mode-style "fg=#e3e6eb,bg=#2f4b42"   # copy-mode selection, same as ghostty
