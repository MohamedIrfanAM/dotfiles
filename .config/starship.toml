format = """
$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$lua$java$c$fill${custom.repo}
$character
"""

[fill]
symbol = " "

[cmd_duration]
disabled = true

[custom.repo]
command = "git remote get-url origin 2>/dev/null | sed -E 's#.*[:/]([^/]+/[^/]+)$#\\1#; s/\\.git$//'"
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = '[$output]($style) '
style = "bold blue"
