format = """
$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$lua$java$c$fill$kubernetes$gcloud
$character
"""

[fill]
symbol = " "

[cmd_duration]
disabled = true

[kubernetes]
disabled = false
format = '[$symbol$context]($style)'
symbol = "⎈ "
style = "bold blue"

[[kubernetes.contexts]]
context_pattern = 'gke_.*_(?P<cluster>[\w-]+)$'
context_alias = "$cluster"

[gcloud]
format = '[$symbol$project]($style) '
symbol = " "
style = "bold blue"
disabled = false
